services:
  mtls-certificate-manager:
    build: .
    # image: ghcr.io/yourorg/mtls-certificate-manager:latest
    container_name: mtls-certificate-manager
    restart: unless-stopped
    #ports:
    #  - "3000:3000"
    environment:
      # --- runtime ---
      - PORT=${PORT:3000}
      - PUID=${PUID}
      - PGID=${PGID}

      # --- certificate settings ---
      - CERT_VALIDITY_DAYS=${CERT_VALIDITY_DAYS:365}

      # --- GoKapi integration (used by the "send via one-time link" action) ---
      - GOKAPI_API_URL=${GOKAPI_API_URL}
      - GOKAPI_API_KEY=${GOKAPI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./pki:/app/pki
