services:
  mtls-certificate-manager:
    build: .
    # image: ghcr.io/yourorg/mtls-certificate-manager:latest
    container_name: mtls-certificate-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # --- runtime ---
      PORT: "3000"
      PUID: "1001"
      PGID: "1001"

      # --- certificate settings ---
      CERT_VALIDITY_DAYS: "365"

      # --- GoKapi integration (used by the "send via one-time link" action) ---
      GOKAPI_API_URL: "https://files.example.com"
      GOKAPI_API_KEY: "${GOKAPI_API_KEY:?set GOKAPI_API_KEY in .env or the shell environment, never hardcode it here}"
    volumes:
      - ./data:/app/data
      - ./pki:/app/pki
